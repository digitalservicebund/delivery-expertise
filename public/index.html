<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">

  <title>Engineering expertise</title>
  <link rel="stylesheet" href="src/style.css">

<body>

      <li><i class="short"></i>Critical shortage</li>
      <li><i class="strained"></i>Undersupplied</li>
      <li><i class="fragile"></i>Covered but fragile</li>
      <li><i class="covered"></i>Well covered</li>
      <li><i class="surplus"></i>Oversupplied</li>
      <li><i class="hatch-key"></i>Hatched: filled by someone more senior</li>

    <a class="page-link" href="survey.html">Survey prototype →</a>

      <div id="personas" role="group" aria-label="View as"></div>

  <nav aria-label="Projects and teams"><ul id="scopes"></ul><div id="for-you" hidden></div></nav>
  <main>
    <svg id="chart" role="img" aria-label="Demanded expertise by level and FTE"></svg>
