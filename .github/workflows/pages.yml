name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
      # The site lives under an unguessable folder taken from a secret, so the
      # URL is not discoverable from the repo. The site root stays empty (404).
      - name: Assemble site
        env:
          PAGES_PATH: ${{ secrets.PAGES_PATH }}
        run: |
          [[ "$PAGES_PATH" =~ ^[A-Za-z0-9_-]{16,}$ ]] || { echo "::error::PAGES_PATH secret missing or too short"; exit 1; }
          mkdir -p "_site/$PAGES_PATH"
          cp -r public/. "_site/$PAGES_PATH/"
          cp -r src data "_site/$PAGES_PATH/"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
