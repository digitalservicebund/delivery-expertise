name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: npm test
      # The site lives under an unguessable folder taken from a secret, so the
      # URL is not discoverable from the repo. The site root stays empty (404).
      - name: Assemble site
        env:
          PAGES_PATH: ${{ secrets.PAGES_PATH }}
        run: |
          [[ "$PAGES_PATH" =~ ^[A-Za-z0-9_-]{16,}$ ]] || { echo "::error::PAGES_PATH secret missing or too short"; exit 1; }
          mkdir -p "_site/$PAGES_PATH"
          cp -r public/. "_site/$PAGES_PATH/"
          cp -r src data "_site/$PAGES_PATH/"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
